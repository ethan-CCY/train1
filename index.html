<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>食品照片判定測驗</title><style>:root{--line:#e5e7eb;--text:#1f2937;--muted:#6b7280;--primary:#111827;--good:#ecfdf5;--goodLine:#a7f3d0;--bad:#fef2f2;--badLine:#fecaca;--warn:#fffbeb;--warnLine:#fde68a}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;background:linear-gradient(180deg,#f8fafc 0%,#eef2ff 100%);color:var(--text)}.wrap{max-width:760px;margin:0 auto;padding:18px 14px 40px}.top{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-bottom:12px}.badge{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:14px}.progress{width:100%;height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-bottom:14px}.bar{height:100%;background:linear-gradient(90deg,#111827 0%,#374151 100%);transition:width .25s ease}.card,.result-card{background:#fff;border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:0 10px 30px rgba(15,23,42,.08)}.img-wrap{position:relative;background:#f3f4f6}.img-wrap img{display:block;width:100%;height:auto;max-height:62vh;object-fit:contain;background:#f8fafc}.tag{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:12px;font-weight:700}.body{padding:18px}h1{font-size:24px;line-height:1.35;margin:0 0 8px}.sub,.muted,.hero-line,.lang{font-size:14px;line-height:1.7;color:var(--muted)}.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}button{font:inherit;cursor:pointer;border:none}.btn,.reason,.submit,.next,.restart{width:100%;border-radius:18px;padding:16px 14px}.btn{border:1px solid var(--line);background:#fff;color:var(--text);font-weight:700;line-height:1.55}.btn.active{border-color:var(--primary);box-shadow:0 0 0 2px rgba(17,24,39,.08)}.btn:disabled,.submit:disabled{opacity:.65;cursor:not-allowed}.choice-btn{display:flex;align-items:center;gap:16px;text-align:left}.choice-icon{width:72px;min-width:72px;height:72px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:900;background:#fff}.choice-icon.correct{border:5px solid #65a30d;color:#65a30d}.choice-icon.wrong{color:#dc2626;font-size:56px;line-height:1}.choice-text{display:flex;flex-direction:column;justify-content:center}.choice-text .main{font-size:20px;font-weight:900;color:var(--text);line-height:1.3;margin-bottom:4px}.choice-text .sub{font-size:14px;color:#374151;line-height:1.5;margin:0}.reasons{border:1px solid var(--warnLine);background:var(--warn);border-radius:18px;padding:14px;margin-bottom:14px}.reasons-title{font-weight:800;margin-bottom:10px;line-height:1.6;color:#92400e}.reason{text-align:left;border:1px solid #fcd34d;background:#fff;padding:12px 13px;margin-bottom:8px;line-height:1.55}.reason.active{background:#fef3c7;border-color:#f59e0b;color:#78350f;font-weight:700}.submit,.next,.restart{background:var(--primary);color:#fff;font-weight:800;line-height:1.5}.feedback{border-radius:18px;padding:14px;margin-bottom:14px;border:1px solid var(--line);line-height:1.7}.feedback.good{background:var(--good);border-color:var(--goodLine);color:#065f46}.feedback.bad{background:var(--bad);border-color:var(--badLine);color:#991b1b}.feedback strong{display:block;margin-bottom:6px;font-size:18px}.result-card{padding:20px}.result-hero{margin:16px 0 18px;border-radius:24px;padding:20px 16px;text-align:center;border:1px solid var(--line)}.perfect{background:linear-gradient(180deg,#fff7d6 0%,#ffefad 100%);border-color:#f4d26b}.keep-going{background:linear-gradient(180deg,#eff6ff 0%,#dbeafe 100%);border-color:#93c5fd}.hero-icon{width:92px;height:92px;margin:0 auto 12px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:50px;background:rgba(255,255,255 ct',title_zh:'第 11 題',title_id:'Soal 11',title_vi:'Câu 11',explanation:{zh:'正解：正確；原因：隔底籃墊高',id:'Jawaban benar: Benar; alasan: Ditinggikan dengan keranjang alas',vi:'Đáp án đúng: Đúng; lý do: Được kê cao bằng rổ lót bên dưới'}},{id:12,image:'images/OilTin.png',answer:'correct',title_zh:'第 12 題',title_id:'Soal 12',title_vi:'Câu 12',explanation:{zh:'正解：正確；原因：隔推車墊高',id:'Jawaban benar: Benar; alasan: Ditinggikan dengan troli',vi:'Đáp án đúng: Đúng; lý do: Được kê cao bằng xe đẩy bên dưới'}}];let currentIndex=0,score=0,selectedChoice='',selectedReason='',submitted=false,lastCorrect=false;const app=document.getElementById('app');function choiceButton(v,zh,id,vi){const iconClass=v==='correct'?'correct':'wrong';const iconText=v==='correct'?'O':'✕';return `<button class="btn choice-btn ${selectedChoice===v?'active':''}" ${submitted?'disabled':''} onclick="chooseChoice('${v}')"><div class="choice-icon ${iconClass}">${iconText}</div><div class="choice-text"><div class="main">${zh}</div><div class="sub">${id}</div><div class="sub">${vi}</div></div></button>`}function reasonButtons(){const q=questions[currentIndex],opts=q.wrongReasonOptions||[];return opts.map(o=>`<button class="reason ${selectedReason===o.value?'active':''}" ${submitted?'disabled':''} onclick="chooseReason('${o.value}')"><div>${o.zh||'&nbsp;'}</div><div class="lang">${o.id||'&nbsp;'}</div><div class="lang">${o.vi||'&nbsp;'}</div></button>`).join('')}function canSubmit(){if(!selectedChoice)return false;if(selectedChoice==='wrong')return!!selectedReason;return true}function submitAnswer(){if(!canSubmit())return;const q=questions[currentIndex];const correct=q.answer==='correct'?selectedChoice==='correct':selectedChoice==='wrong'&&selectedReason===q.reasonAnswer;if(correct)score+=1;lastCorrect=correct;submitted=true;render()}function nextQuestion(){currentIndex+=1;selectedChoice='';selectedReason='';submitted=false;lastCorrect=false;render()}function restartQuiz(){currentIndex=0;score=0;selectedChoice='';selectedRea
